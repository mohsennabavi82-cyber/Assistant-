<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a2a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>LIFEOS | دستیار تلگرام</title>
<style>
:root{
  --ink:#f1f5ff;--muted:#a9b8ec;--dim:#7686c4;
  --blue:#3b6cff;--blue2:#2646d8;--cyan:#35d4ff;
  --glass:linear-gradient(160deg,rgba(130,160,255,.26),rgba(45,70,200,.16) 55%,rgba(30,50,170,.2));
  --edge:rgba(160,190,255,.5);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  width:100%;max-width:100vw;font-family:'Vazirmatn',Tahoma,sans-serif;font-size:14px;line-height:1.75;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(700px 520px at 85% 8%,rgba(60,110,255,.34),transparent 62%),
    radial-gradient(640px 520px at 8% 62%,rgba(40,90,230,.28),transparent 62%),
    radial-gradient(700px 600px at 70% 100%,rgba(30,130,255,.26),transparent 62%),
    linear-gradient(180deg,#071039,#050a2a 55%,#060c33);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

/* backdrop */
.bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bub{animation:bob 9s ease-in-out infinite alternate}
.bub:nth-child(2){animation-duration:12s}.bub:nth-child(3){animation-duration:10s}
@keyframes bob{to{transform:translateY(-14px)}}

/* phone frame */
.stage{position:relative;z-index:1;height:100%;display:flex;justify-content:center}
.phone{width:100%;max-width:560px;min-width:0;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.stage>*{flex:0 1 560px}
@media(min-width:700px){
  .stage{align-items:center}
  .phone{height:min(calc(100dvh - 32px),960px);border-radius:34px;border:1px solid rgba(150,180,255,.3);overflow:hidden;
    background:linear-gradient(180deg,rgba(8,16,70,.45),rgba(5,10,42,.55));backdrop-filter:blur(8px);
    box-shadow:0 0 0 6px rgba(80,120,255,.07),0 30px 90px rgba(0,5,40,.7),0 0 80px rgba(60,110,255,.25)}
}

/* glass util */
.glass{position:relative;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(120,160,255,.18),0 10px 30px rgba(0,8,60,.4)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(160deg,rgba(210,225,255,.85),rgba(120,160,255,.18) 40%,rgba(120,170,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* header */
.top{display:flex;align-items:center;gap:14px;margin:0;padding:12px 16px;border-radius:0 0 30px 30px;flex:none;z-index:5;direction:ltr}
@media(min-width:700px){.top{border-radius:0 0 30px 30px}}
.back,.kebab{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#fff}
.back:hover,.kebab:hover{background:rgba(255,255,255,.1)}
.avatar{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,#1c3fb8,#0a1a62);box-shadow:0 0 0 2px rgba(120,190,255,.7),0 0 22px rgba(53,212,255,.55)}
.who{flex:1;min-width:0;line-height:1.3}
.who b{display:flex;align-items:center;gap:7px;font-size:23px;font-weight:700;letter-spacing:.2px}
.who small{color:var(--muted);font-size:15px;display:block}
.menu{position:absolute;top:70px;right:12px;min-width:220px;border-radius:18px;padding:6px;z-index:20;display:none;direction:rtl}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:right;padding:10px 14px;border-radius:12px;font-size:13.5px}
.menu button:hover{background:rgba(255,255,255,.1)}
.menu{background:linear-gradient(160deg,rgba(40,60,170,.96),rgba(14,24,100,.98))}

/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:0}
.msg{display:flex;flex-direction:column;max-width:92%;gap:6px;animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.msg.bot{align-self:flex-end}
.msg.full{max-width:100%;width:100%;align-self:stretch}
.msg.user{align-self:flex-start}
.bubble{position:relative;padding:11px 15px 8px;border-radius:20px;direction:rtl;text-align:right;word-break:break-word;font-size:14px}
.bot .bubble{background:linear-gradient(160deg,rgba(125,155,255,.24),rgba(40,60,190,.2));border:1px solid rgba(160,190,255,.4);border-bottom-left-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px rgba(0,8,60,.35);backdrop-filter:blur(12px)}
.user .bubble{background:linear-gradient(145deg,#4a7bff,#2a45d6);border-bottom-right-radius:6px;box-shadow:0 8px 22px rgba(40,80,255,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.bubble b{font-weight:700}
.bubble .ts,.ts{display:block;direction:ltr;text-align:left;font-size:11px;color:rgba(220,230,255,.55);margin-top:3px}
.user .ts{text-align:right}
.bubble ul{list-style:none;padding:0;margin:4px 0 2px}
.bubble li{padding:3px 0}
.hd{font-weight:700;font-size:15px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12.5px}
.sp{height:6px}

/* welcome card */
.welcome{position:relative;display:flex;align-items:stretch;min-height:250px;border-radius:30px;padding:0;overflow:hidden;direction:ltr;
  background:linear-gradient(150deg,rgba(130,160,255,.3),rgba(40,60,190,.2) 50%,rgba(30,50,170,.3));
  border:1px solid rgba(170,200,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 40px rgba(0,8,70,.5),0 0 40px rgba(70,120,255,.25);backdrop-filter:blur(14px)}
.welcome::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px 220px at 78% 40%,rgba(53,160,255,.38),transparent 70%)}
.wtext{position:relative;z-index:2;flex:1;padding:22px 8px 22px 22px;direction:rtl;text-align:right;display:flex;flex-direction:column;justify-content:center}
.wtext h2{font-size:24px;font-weight:800;line-height:1.55}
.wtext h2 .nm{color:#59b4ff;font-weight:800;letter-spacing:.3px}
.wtext p{font-size:13.5px;color:#dbe5ff;line-height:2;margin-top:12px}
.wchar{position:absolute;right:15%;bottom:0;height:91%;width:auto;z-index:1;filter:drop-shadow(0 0 20px rgba(80,150,255,.6))}
.wcal{position:absolute;right:14px;top:16px;z-index:1;opacity:.95}
.welcome .ts{position:absolute;right:16px;bottom:8px;z-index:3}
.wspace{width:48%;flex:none}
.tip{display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:22px;font-size:13.5px;direction:rtl;margin-top:-2px}
.tip .bulb{font-size:22px;filter:drop-shadow(0 0 8px rgba(255,210,80,.7))}

/* inline keyboard */
.ikb{display:flex;flex-direction:column;gap:6px}
.irow{display:flex;gap:6px}
.ib{flex:1;min-height:40px;padding:8px 12px;border-radius:14px;font-size:13px;font-weight:600;text-align:center;line-height:1.4;position:relative;
  background:linear-gradient(160deg,rgba(135,165,255,.28),rgba(50,75,205,.2));border:1px solid rgba(160,190,255,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(0,8,60,.3);transition:.15s;backdrop-filter:blur(10px)}
.ib:hover{transform:translateY(-1px);background:linear-gradient(160deg,rgba(150,180,255,.4),rgba(60,90,230,.3));border-color:rgba(200,220,255,.7)}
.ib:active{transform:scale(.98)}

/* calendar in bubble */
.cal-t{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:6px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px 2px;text-align:center;direction:rtl;min-width:240px}
.cgrid i{font-style:normal;color:var(--dim);font-size:11px}
.cgrid span{position:relative;height:30px;display:grid;place-items:center;font-size:12.5px;border-radius:50%;width:30px;margin:auto}
.cgrid span.has::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#ffd04a;box-shadow:0 0 6px #ffd04a}
.cgrid span.td{background:linear-gradient(135deg,#6b8cff,#3a4fe0);font-weight:700;box-shadow:0 0 14px rgba(90,130,255,.8)}

/* mini charts */
.bars{display:flex;align-items:flex-end;gap:7px;height:76px;margin:8px 0 2px;direction:rtl}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--muted)}
.bars b{display:block;width:100%;max-width:22px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#8fb0ff,#3b64ff);min-height:4px;position:relative;overflow:hidden}
.bars b i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#4fe6c0,#16b58c)}
.statrow{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:17px}
.pb{display:inline-block;direction:ltr;letter-spacing:1px;color:#7fe3c4;font-size:12px}

/* typing */
.typing{align-self:flex-end;padding:12px 16px;border-radius:20px;border-bottom-left-radius:6px;display:flex;gap:5px;
  background:linear-gradient(160deg,rgba(125,155,255,.24),rgba(40,60,190,.2));border:1px solid rgba(160,190,255,.4)}
.typing i{width:7px;height:7px;border-radius:50%;background:#bcd0ff;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-4px)}}

/* reply keyboard (menu) */
.kbwrap{flex:none;padding:6px 12px 6px;transition:.2s}
.kbwrap.hide{display:none}
.kbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.kb{min-width:0;display:flex;align-items:center;gap:8px;padding:9px 12px;min-height:66px;border-radius:22px;text-align:right;direction:ltr;color:#fff;transition:.15s}
.kb:hover{transform:translateY(-1px);filter:brightness(1.12)}
.kb:active{transform:scale(.98)}
.kb .ico{flex:none;width:42px;height:42px;display:grid;place-items:center}
.kb .tx{flex:1;min-width:0;direction:rtl;text-align:right;line-height:1.45}
.kb .tx b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb .tx small{display:block;color:#a9b8ec;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb .chev{flex:none;color:#fff;opacity:.95}

/* input */
.inbar{flex:none;display:flex;align-items:center;gap:6px;margin:4px 12px calc(12px + env(safe-area-inset-bottom));padding:6px 10px;border-radius:999px;direction:ltr}
.inbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:8px 6px;color:#fff;direction:auto}
.inbar input::placeholder{color:#8ea6ee}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#b8c8ff;flex:none}
.ibtn:hover{background:rgba(255,255,255,.1);color:#fff}
.send{background:linear-gradient(145deg,#4a7bff,#2a45d6);color:#fff;box-shadow:0 0 16px rgba(70,110,255,.7)}
.send:hover{background:linear-gradient(145deg,#5a88ff,#3552e6)}

.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-20px);z-index:60;background:rgba(20,34,130,.96);border:1px solid rgba(160,190,255,.5);padding:10px 18px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 10px 30px rgba(0,0,50,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:420px){
  .wchar{right:9%;height:84%}.wspace{width:46%}.welcome{min-height:236px}.wtext h2{font-size:21px}.wtext p{font-size:12.5px}
  .kb{min-height:60px;padding:7px 9px;gap:6px;border-radius:19px}.kb .ico{width:36px;height:36px}.kb .tx b{font-size:13px}.kb .tx small{font-size:10px}
  .kbgrid{gap:7px}.avatar{width:52px;height:52px}.who b{font-size:21px}
}
@media(max-height:760px){.kb{min-height:54px}.kb .tx small{display:none}.kbgrid{gap:6px}.welcome{min-height:210px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* LIFEOS sign-in and Telegram linking */
#authGate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:auto;background:#070a1c;padding:24px;box-sizing:border-box}#authGate[hidden]{display:none}.authbox{box-sizing:border-box;width:min(388px,100%);padding:30px 26px 34px;border:1px solid rgba(107,120,255,.28);border-radius:18px;background:linear-gradient(145deg,rgba(26,35,77,.94),rgba(18,24,54,.96));box-shadow:0 24px 80px rgba(0,0,0,.24);color:#f3f4ff;font-family:Tahoma,sans-serif;text-align:center}.auth-logo{display:block;width:58px;height:36px;margin:0 auto 12px}.authbox h1{margin:0;font-size:25px}.auth-subtitle{margin:8px 0 24px!important;color:#8db0ff!important;font-size:12px}.authbox .auth-help{margin:0 0 18px;text-align:right;color:#aab8ee;line-height:1.9;font-size:13px}.authbox label{display:block;text-align:right;margin:0 0 7px;font-size:13px;font-weight:700}.authbox input{box-sizing:border-box;width:100%;height:44px;padding:0 13px;margin:0 0 14px;border:1px solid rgba(109,124,255,.28);border-radius:11px;background:rgba(8,14,39,.68);color:white;font:14px Tahoma,sans-serif}.auth-actions{display:flex;gap:9px}.authbox button{min-height:44px;padding:0 19px;border:0;border-radius:12px;background:linear-gradient(100deg,#633bf0,#8456ff);color:white;font:700 13px Tahoma,sans-serif;cursor:pointer}.authbox button[data-mode=signup]{background:rgba(91,105,170,.18);border:1px solid rgba(131,145,218,.25)}.auth-error{min-height:24px;color:#ff9aa8;text-align:right;line-height:1.7;font-size:12px}.telegram-status{position:absolute;z-index:12;left:14px;right:14px;bottom:80px;padding:12px 14px;border-radius:16px;background:rgba(12,20,60,.96);border:1px solid rgba(100,170,255,.55);box-shadow:0 8px 28px #0008;direction:rtl;font-size:13px;line-height:1.8}.telegram-status[hidden]{display:none}.telegram-status a{display:inline-block;margin-top:5px;color:#fff;background:#654cff;padding:8px 13px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<div id="authGate"><form class="authbox" id="authForm"><svg class="auth-logo" viewBox="0 0 64 40" fill="none" aria-label="لوگوی LIFEOS"><defs><linearGradient id="authLogoGrad" x1="5" y1="20" x2="59" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#28d7ee"/><stop offset="1" stop-color="#8b5cff"/></linearGradient></defs><path d="M32 20C25 11 20 6 14 6a14 14 0 1 0 0 28c7 0 12-5 18-14Zm0 0C39 11 44 6 50 6a14 14 0 1 1 0 28c-7 0-12-5-18-14Z" stroke="url(#authLogoGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>LIFEOS</h1><p class="auth-subtitle">Your Personal AI Assistant</p><p class="auth-help">برای ادامه، وارد حساب خود شوید یا حساب جدید بسازید.</p><label for="authEmail">ایمیل</label><input id="authEmail" type="email" placeholder="name@example.com" autocomplete="email" required><label for="authPassword">گذرواژه</label><input id="authPassword" type="password" minlength="6" placeholder="حداقل ۶ نویسه" autocomplete="current-password" required><div class="auth-error" id="authError" aria-live="polite"></div><div class="auth-actions"><button type="submit" data-mode="login">ورود</button><button type="submit" data-mode="signup">ساخت حساب</button></div></form></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ea2ff"/><stop offset="1" stop-color="#2447cf"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a6ff"/><stop offset="1" stop-color="#6a45e0"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f29a0c"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ff0d2"/><stop offset="1" stop-color="#17a88a"/></linearGradient>
  <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35d4ff"/><stop offset="1" stop-color="#1fe0a8"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs></svg>

<!-- decorative backdrop: bubbles + foliage -->
<svg class="bgfx" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="bb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7fa6ff" stop-opacity=".5"/><stop offset=".6" stop-color="#2d4bd8" stop-opacity=".22"/><stop offset="1" stop-color="#1a2a99" stop-opacity=".1"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7d86"/><stop offset="1" stop-color="#0a2c55"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <g class="bub"><circle cx="520" cy="190" r="78" fill="url(#bb)" stroke="#8fb2ff" stroke-opacity=".4"/><path d="M468 160a62 62 0 0 1 40-34" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g class="bub"><circle cx="40" cy="470" r="64" fill="url(#bb)" stroke="#8fb2ff" stroke-opacity=".35"/></g>
  <g class="bub"><circle cx="500" cy="760" r="92" fill="url(#bb)" stroke="#8fb2ff" stroke-opacity=".35"/><path d="M440 730a72 72 0 0 1 42-44" stroke="#fff" stroke-opacity=".4" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g class="bub"><circle cx="120" cy="40" r="46" fill="url(#bb)" stroke="#8fb2ff" stroke-opacity=".3"/></g>
  <g fill="url(#leaf)" stroke="#35d4ff" stroke-opacity=".35" filter="url(#soft)">
    <ellipse cx="586" cy="420" rx="62" ry="22" transform="rotate(-38 586 420)"/><ellipse cx="596" cy="470" rx="70" ry="24" transform="rotate(-12 596 470)"/><ellipse cx="590" cy="520" rx="60" ry="20" transform="rotate(28 590 520)"/><ellipse cx="598" cy="360" rx="52" ry="18" transform="rotate(-62 598 360)"/>
    <ellipse cx="-6" cy="760" rx="64" ry="22" transform="rotate(-30 -6 760)"/><ellipse cx="4" cy="810" rx="72" ry="24" transform="rotate(-6 4 810)"/><ellipse cx="-4" cy="860" rx="62" ry="22" transform="rotate(32 -4 860)"/><ellipse cx="8" cy="700" rx="50" ry="18" transform="rotate(-56 8 700)"/>
  </g>
</svg>

<div class="stage"><div class="phone app" id="phone" style="visibility:hidden">
  <header class="top glass">
    <button class="back" id="btnBack" aria-label="بازگشت"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="avatar"><svg width="42" height="42" viewBox="0 0 64 40" fill="none" aria-label="لوگوی LIFEOS"><defs><linearGradient id="lifeosLogoHead" x1="4" y1="20" x2="60" y2="20"><stop stop-color="#28d7ee"/><stop offset="1" stop-color="#8b5cff"/></linearGradient></defs><path d="M32 20C25 11 20 6 14 6a14 14 0 1 0 0 28c7 0 12-5 18-14Zm0 0C39 11 44 6 50 6a14 14 0 1 1 0 28c-7 0-12-5-18-14Z" stroke="url(#lifeosLogoHead)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="who"><b>LIFEOS</b><small>دستیار شخصی</small></div>
    <button class="kebab" id="btnKebab" aria-label="منو"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>

/* date / time parsing for typed answers */
function parseDate(txt){
  const t=en(String(txt)).replace(/[\s\u200c]/g,'');
  if(t==='امروز'||t==='today')return today();
  if(t==='فردا'||t==='tomorrow')return addDays(today(),1);
  if(t==='پسفردا')return addDays(today(),2);
  const m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(m){let y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;if(y<1700){const g=j2g(y,mo,d);y=g[0];mo=g[1];d=g[2]}return `${y}-${pad(mo)}-${pad(d)}`}
  return null;
}
function parseTime(txt){const m=en(String(txt)).trim().match(/^(\d{1,2})[:٫.](\d{2})$/);if(!m||+m[1]>23||+m[2]>59)return null;return `${pad(+m[1])}:${pad(+m[2])}`}

/* ================= flows ================= */
const STEPS={task:['title','date','priority'],reminder:['title','time','date'],event:['title','date','time'],note:['title','body'],research:['q'],name:['name']};
let flow=null,pending=null;
const CANCEL=[['❌ انصراف','cancel']];
const NOUN={task:'کار',reminder:'یادآور',event:'رویداد',note:'یادداشت'};
function startFlow(type,preset={}){flow={type,i:0,d:{...preset}};nextStep()}
function nextStep(){
  const st=STEPS[flow.type];
  while(flow.i<st.length&&flow.d[st[flow.i]]!==undefined)flow.i++;
  if(flow.i>=st.length)return finish();
  const step=st[flow.i],t=flow.type;
  if(step==='title')say({html:{task:'📝 عنوان کار چیه؟',reminder:'⏰ یادآوری برای چی؟',event:'📅 عنوان رویداد چیه؟',note:'🗒 عنوان یادداشت چیه؟'}[t],kb:[CANCEL]});
  else if(step==='body')say({html:'✍️ متن یادداشت رو بنویس:',kb:[CANCEL]});
  else if(step==='q')say({html:'🔎 سؤال تحقیقت رو بنویس:',kb:[CANCEL]});
  else if(step==='name')say({html:'✏️ اسمت رو بنویس:',kb:[CANCEL]});
  else if(step==='date')say({html:'📆 برای چه روزی؟<br><span class="sub">یا تاریخ رو بنویس، مثلاً ۱۴۰۵/۰۹/۱۰</span>',kb:[[['امروز','fv','امروز'],['فردا','fv','فردا'],['پس‌فردا','fv','پسفردا']],CANCEL]});
  else if(step==='time')say({html:'🕒 چه ساعتی؟<br><span class="sub">یا بنویس، مثلاً ۱۴:۳۰</span>',kb:[[['۰۹:۰۰','fv','09:00'],['۱۲:۰۰','fv','12:00'],['۱۸:۰۰','fv','18:00'],['۲۱:۰۰','fv','21:00']],CANCEL]});
  else if(step==='priority')say({html:'🚦 اولویتش چقدره؟',kb:[[['🔴 مهم','fv','high'],['🟡 معمولی','fv','mid'],['🟢 کم','fv','low']],CANCEL]});
}
function submit(val,asText){
  if(!flow)return;
  const step=STEPS[flow.type][flow.i];let v=null;
  if(step==='title'||step==='body'||step==='q'||step==='name')v=String(val).trim()||null;
  else if(step==='date')v=parseDate(val);
  else if(step==='time')v=parseTime(val);
  else if(step==='priority'){const t=String(val).trim();v=['high','mid','low'].includes(t)?t:({'مهم':'high','معمولی':'mid','کم':'low'}[t]||null)}
  if(v===null){say({html:step==='date'?'تاریخ رو متوجه نشدم 🤔 مثل «فردا» یا ۱۴۰۵/۰۹/۱۰ بنویس.':step==='time'?'ساعت رو متوجه نشدم 🤔 مثل ۱۴:۳۰ بنویس.':step==='priority'?'یکی از «مهم»، «معمولی» یا «کم» رو انتخاب کن.':'یه متن بنویس لطفاً.',kb:[CANCEL]});return}
  if(!asText&&step!=='priority'&&step!=='date'&&step!=='time')return;
  flow.d[step]=v;flow.i++;nextStep();
}
function finish(){
  const {type,d}=flow;flow=null;const id=Date.now();
  if(type==='task'){data.tasks.unshift({id,title:d.title,date:d.date,priority:d.priority,done:false});log('task','کار جدید: '+d.title);save();
    say({html:`✅ کار «<b>${esc(d.title)}</b>» برای <b>${relDate(d.date)}</b> ثبت شد.<br><span class="sub">اولویت: ${PRI[d.priority]}</span>`,kb:[[['➕ یکی دیگه','add','task'],['📅 برنامه امروز','menu','today']]]})}
  else if(type==='reminder'){data.reminders.push({id,title:d.title,date:d.date,time:d.time});log('reminder','یادآور جدید: '+d.title);save();
    say({html:`⏰ یادآور «<b>${esc(d.title)}</b>» برای <b>${relDate(d.date)}</b> ساعت <b>${fa(d.time)}</b> تنظیم شد.`,kb:[[['➕ یکی دیگه','add','reminder'],['⏰ یادآوری‌ها','menu','reminders']]]})}
  else if(type==='event'){data.events.push({id,title:d.title,date:d.date,time:d.time});log('event','رویداد جدید: '+d.title);save();
    say({html:`📅 رویداد «<b>${esc(d.title)}</b>» برای <b>${relDate(d.date)}</b> ساعت <b>${fa(d.time)}</b> ثبت شد.`,kb:[[['➕ یکی دیگه','add','event'],['📆 تقویم','menu','calendar']]]})}
  else if(type==='note'){data.notes.unshift({id,title:d.title,body:d.body,date:today()});log('note','یادداشت جدید: '+d.title);save();
    say({html:`🗒 یادداشت «<b>${esc(d.title)}</b>» ذخیره شد.`,kb:[[['➕ یکی دیگه','add','note'],['🗒 یادداشت‌ها','menu','notes']]]})}
  else if(type==='research'){say({html:`در حال آماده‌کردن پاسخ برای این سؤال:<br><b>${esc(d.q)}</b>`});if(window.askOpenRouter)window.askOpenRouter(d.q).then(answer=>say({html:`✨ پاسخ LIFEOS:<br><span style="white-space:pre-wrap">${esc(answer)}</span>`})).catch(err=>say({html:`نتونستم پاسخ بگیرم: ${esc(err.message)}`}));else say({html:'اتصال به پاسخ‌گوی هوشمند آماده نیست.'})}
  else if(type==='name'){S.name=d.name;save();say({html:`👤 باشه، از این به بعد صدات می‌زنم <b>${esc(d.name)}</b> 😎`})}
}

/* ================= actions ================= */
function menu(k,echo=true){
  if(echo){const m=MENU.find(x=>x[0]===k);if(m)userSay(m[1])}
  flow=null;
  ({add:addMenu,today:todayView,calendar:()=>calView(tj[0],tj[1]),reminders:remindersView,settings:()=>settingsView(),dash:dashView,notes:notesView,research:()=>startFlow('research')})[k]();
}
function act(a,v,w){
  if(a==='menu'){menu(v);return}
  if(a==='add'){userSay('➕ '+NOUN[v]);startFlow(v);return}
  if(a==='fv'){userSay(v==='high'?'🔴 مهم':v==='mid'?'🟡 معمولی':v==='low'?'🟢 کم':v.match(/^\d\d:\d\d$/)?fa(v):v==='پسفردا'?'پس‌فردا':v);submit(v,true);return}
  if(a==='cancel'){flow=null;pending=null;say({html:'باشه، لغو شد ✅'});return}
  if(a==='cal'){const [y,m]=v.split('-').map(Number);calView(y,m,w);return}
  if(a==='rep'){reportView(v);return}
  if(a==='qs'){const title=pending;pending=null;if(!title){say({html:'متنی برای ذخیره نیست.'});return}userSay(NOUN[v]);startFlow(v,{title});return}
  if(a==='done'){const t=data.tasks.find(x=>String(x.id)===v);if(t&&!t.done){t.done=true;log('done','انجام شد: '+t.title);save();say({html:`🎉 آفرین! «<b>${esc(t.title)}</b>» انجام شد.`,kb:[[['📅 برنامه امروز','menu','today'],['📊 داشبورد','menu','dash']]]})}else say({html:'این کار قبلاً انجام شده 👌'});return}
  if(a==='delrem'){const r=data.reminders.find(x=>String(x.id)===v);data.reminders=data.reminders.filter(x=>String(x.id)!==v);save();say({html:`🗑 یادآور «${esc(r?.title||'')}» حذف شد.`});return}
  if(a==='delnote'){const n=data.notes.find(x=>String(x.id)===v);data.notes=data.notes.filter(x=>String(x.id)!==v);save();say({html:`🗑 یادداشت «${esc(n?.title||'')}» حذف شد.`});return}
  if(a==='snooze'){const r=data.reminders.find(x=>String(x.id)===v);if(r){const d=new Date(Date.now()+10*60000);r.date=isoLocal(d);r.time=`${pad(d.getHours())}:${pad(d.getMinutes())}`;fired.delete(r.id);save();say({html:`⏱ باشه، ۱۰ دقیقه دیگه دوباره یادآوری می‌کنم (${hhmm(d)}).`})}return}
  if(a==='ok'){say({html:'👍'},200);return}
  if(a==='set'){
    if(v==='notif'){S.notif=!S.notif;save();settingsView(w)}
    else if(v==='digest'){S.digest=!S.digest;save();settingsView(w)}
    else if(v==='name'){startFlow('name')}
    else if(v==='reset'){say({html:'⚠️ مطمئنی همه کارها، یادداشت‌ها، رویدادها و یادآورها پاک بشن؟ این کار برگشت نداره.',kb:[[['✅ بله، پاک کن','set','reset-yes'],['انصراف','cancel']]]})}
    else if(v==='reset-yes'){data.tasks=[];data.notes=[];data.events=[];data.reminders=[];data.activity=[];save();say({html:'🧹 همه داده‌ها پاک شد.'})}
  }
}
function command(t){
  const [c0,...r]=t.trim().split(/\s+/),arg=r.join(' '),c=c0.toLowerCase().replace(/@\w+$/,'');
  userSay(t);
  if(window.askOpenRouter){window.askOpenRouter(t).then(answer=>say({html:`✨ پاسخ LIFEOS:<br><span style="white-space:pre-wrap">${esc(answer)}</span>`})).catch(err=>say({html:`نتونستم پاسخ بگیرم: ${esc(err.message)}`}));return}
  const go=k=>menu(k,false);
  if(c==='/start')welcome();
  else if(c==='/today')go('today');else if(c==='/add'){flow=null;addMenu()}
  else if(c==='/reminders')go('reminders');else if(c==='/calendar')go('calendar');
  else if(c==='/notes')go('notes');else if(c==='/settings')go('settings');else if(c==='/dashboard')go('dash');
  else if(c==='/report')reportView(arg.toLowerCase()==='month'?'month':'week');
  else if(c==='/research'){if(arg){flow={type:'research',i:0,d:{q:arg}};finish()}else startFlow('research')}
  else if(c==='/help')helpView();
  else if(c==='/cancel'){flow=null;pending=null;say({html:'باشه، لغو شد ✅'})}
  else say({html:'این فرمان رو نمی‌شناسم 🤔 برای دیدن فرمان‌ها /help رو بزن.'});
}
function handleText(t){
  t=t.trim();if(!t)return;
  if(t.startsWith('/')){command(t);return}
  userSay(t);
  if(flow){submit(t,true);return}
  pending=t;
  say({html:`«<b>${esc(cut(t,60))}</b>» رو به‌عنوان چی ذخیره کنم؟`,kb:[[['📝 کار','qs','task'],['🗒 یادداشت','qs','note']],[['⏰ یادآور','qs','reminder'],['📅 رویداد','qs','event']],CANCEL]});
}

/* ================= reminders & digest (work while the page is open) ================= */
const fired=new Set();let digestDay='';
function tick(){
  const d=new Date(),T=isoLocal(d),hm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(S.notif)data.reminders.filter(r=>r.date===T&&r.time===hm&&!fired.has(r.id)).forEach(r=>{fired.add(r.id);say({html:`🔔 <b>یادآوری:</b> ${esc(r.title)}`,kb:[[['✅ باشه','ok'],['⏱ ۱۰ دقیقه بعد','snooze',r.id]]]},200)});
  if(S.digest&&hm==='08:00'&&digestDay!==T){digestDay=T;say({html:'🌅 صبح بخیر! این هم برنامه امروزت:'},200);todayView()}
}
setInterval(tick,15000);

/* ================= wiring ================= */
chat.addEventListener('click',e=>{const b=e.target.closest('.ib');if(b)act(b.dataset.a,b.dataset.v,b.closest('.msg'))});
$('kbgrid').addEventListener('click',e=>{const b=e.target.closest('[data-menu]');if(b)menu(b.dataset.menu)});
const input=$('msg');
const syncBtns=()=>{const has=input.value.trim().length>0;$('btnSend').hidden=!has;$('btnMic').hidden=has;$('btnClip').hidden=has&&false};
input.addEventListener('input',syncBtns);
$('form').addEventListener('submit',e=>{e.preventDefault();const t=input.value;input.value='';syncBtns();handleText(t)});
$('btnEmoji').onclick=()=>{input.value+='😊';input.focus();syncBtns()};
$('btnClip').onclick=()=>toast('ارسال فایل در این نسخه پشتیبانی نمی‌شود');
$('btnMic').onclick=()=>toast('پیام صوتی در این نسخه پشتیبانی نمی‌شود');
$('btnBack').onclick=()=>{if(history.length>1)history.back();else window.location.href='./LIFEOS-supabase.html'};
const menuEl=$('menu');
$('btnKebab').onclick=e=>{e.stopPropagation();menuEl.classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))menuEl.classList.remove('open')});
menuEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-m]');if(!b)return;menuEl.classList.remove('open');
  const m=b.dataset.m;
  if(m==='telegram'){if(window.connectLifeosTelegram)void window.connectLifeosTelegram();else toast('اتصال تلگرام آماده نیست')}
  else if(m==='start')command('/start');
  else if(m==='help')command('/help');
  else if(m==='kb')$('kbwrap').classList.toggle('hide');
  else if(m==='clear'){chat.innerHTML='';flow=null;pending=null}
});
window.applyLifeosCloudData=(incoming)=>{if(!incoming||typeof incoming!=='object')return;for(const k of Object.keys(data))delete data[k];Object.assign(data,incoming);['tasks','notes','events','reminders','activity'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});if(!data.settings||typeof data.settings!=='object')data.settings={};Object.assign(S,data.settings);data.settings=S};
window.addEventListener('DOMContentLoaded',()=>{});
welcome();
})();
</script>
<script type="module" src="./supabase-app.js"></script>
