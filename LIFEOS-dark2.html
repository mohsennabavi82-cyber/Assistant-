<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>LIFEOS | دستیار زندگی</title>
<style>
:root{
  --bg:#070a1c;--ink:#eef0ff;--muted:#9ba2d0;--dim:#6f77a8;
  --line:rgba(150,142,255,.2);
  --glass:linear-gradient(165deg,rgba(48,42,116,.40),rgba(13,15,44,.68));
  --p1:#7c5cff;--p2:#5b4af0;--blue:#3b73f5;--teal:#1fc8a0;--amber:#f0a81c;--rose:#f0617a;--cyan:#27d3f0;
  --r:20px;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{
  min-height:100vh;font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;font-size:14px;line-height:1.7;color:var(--ink);
  background:
    radial-gradient(900px 600px at 85% -5%,rgba(124,92,255,.34),transparent 60%),
    radial-gradient(800px 700px at 100% 100%,rgba(39,211,240,.20),transparent 60%),
    radial-gradient(700px 600px at 0% 45%,rgba(190,70,200,.14),transparent 60%),
    linear-gradient(180deg,#0a0c27,#070918 60%,#0a0b25);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.ic{flex:none;display:block}

/* ---------- background layers ---------- */
.stars,.neon{position:fixed;pointer-events:none;z-index:0}
.stars{inset:0}
.stars div{position:absolute;top:0;left:0;border-radius:50%}
.stars .s1{width:1px;height:1px}
.stars .s2{width:2px;height:2px;animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.neon{right:0;bottom:0;width:min(70vw,900px);height:78vh;opacity:.5}

.app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;min-height:100vh;max-width:1700px;margin:auto}

/* ---------- glass card ---------- */
.card{position:relative;background:var(--glass);border-radius:var(--r);padding:20px;min-width:0;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 40px rgba(2,3,20,.45)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(180deg,rgba(165,155,255,.55),rgba(165,155,255,.07) 42%,rgba(39,211,240,.28));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.deco::after{content:'';position:absolute;left:16px;bottom:12px;width:46px;height:28px;opacity:.55;pointer-events:none;
  background-image:radial-gradient(rgba(150,140,255,.7) 1.2px,transparent 1.7px);background-size:9px 9px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.card-head h3{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700}
.card-head h3 .ic{color:var(--p1)}
.link-btn{color:#8a86ff;font-size:12px;font-weight:600}
.link-btn:hover{color:#b3b0ff}
.empty{padding:22px 8px;text-align:center;color:var(--dim);font-size:12.5px}

/* ---------- sidebar ---------- */
.sidebar{position:sticky;top:16px;margin:16px 16px 16px 8px;height:calc(100vh - 32px);display:flex;flex-direction:column;padding:22px 16px 16px}
.brand{text-align:center;padding:4px 0 22px}
.brand svg{margin:0 auto 4px;display:block}
.brand strong{display:block;font-size:24px;font-weight:800;letter-spacing:1px;line-height:1.3}
.brand small{display:block;direction:ltr;color:var(--muted);font-size:11px;margin-top:2px}
.nav{display:grid;gap:6px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:13px;color:#a4abd6;font-size:13.5px;font-weight:500;text-align:right;transition:.18s}
.nav-btn:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-btn.active{color:#fff;font-weight:700;background:linear-gradient(135deg,#7c5cff,#5547ee);box-shadow:0 8px 22px rgba(108,86,255,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.profile{display:flex;align-items:center;gap:11px;padding:4px 4px 12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;background:linear-gradient(135deg,#7c5cff,#4a6cf0);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
.profile b{display:block;font-size:13.5px;line-height:1.4}
.profile small{color:var(--teal);font-size:11px;display:flex;align-items:center;gap:5px}
.profile small::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.logout{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;color:#a4abd6;font-size:13px;border-radius:10px}
.logout:hover{color:#fff;background:rgba(255,255,255,.05)}
.ver{text-align:center;color:var(--dim);font-size:10.5px;margin-top:8px;direction:ltr}

/* ---------- main / topbar ---------- */
.main{padding:16px 8px 60px 16px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.mini-brand{display:none;align-items:center;gap:8px;font-weight:800;letter-spacing:.8px;font-size:17px;margin-inline-end:auto}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#cfd3ff;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.icon-btn:hover{color:#fff;border-color:rgba(165,155,255,.5)}
.icon-btn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose)}
.datebox{line-height:1.45}
.datebox b{display:block;font-size:13.5px;font-weight:600}
.datebox small{font-size:11px;color:var(--muted)}
.searchpill{flex:1;min-width:0;max-width:540px;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);color:var(--muted)}
.searchpill:focus-within{border-color:rgba(165,155,255,.6);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
.searchpill input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13px}
.searchpill input::placeholder{color:var(--dim)}

.page{display:none}.page.active{display:block}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:600;font-size:13px;transition:.18s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#7c5cff,#5547ee);color:#fff;box-shadow:0 8px 22px rgba(108,86,255,.42),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(108,86,255,.55),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#cfd3ff}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.icon-ghost{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--dim);flex:none}
.icon-ghost:hover{color:var(--rose);background:rgba(240,97,122,.12)}

/* ---------- dashboard grid ---------- */
.dash{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-areas:"ring hero hero" "quick cal tasks" "conn act week"}
.c-hero{grid-area:hero}.c-ring{grid-area:ring}.c-quick{grid-area:quick}.c-cal{grid-area:cal}.c-tasks{grid-area:tasks}.c-conn{grid-area:conn}.c-act{grid-area:act}.c-week{grid-area:week}

/* hero */
.hero{padding:0;overflow:hidden;min-height:260px;display:flex;align-items:center}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}
.hero-text{position:relative;z-index:2;padding:28px 34px;max-width:56%}
.hero-text h2{font-size:25px;font-weight:800;line-height:1.5;margin-bottom:6px}
.hero-text p{color:#cdc9f5;font-size:13.5px;margin-bottom:18px;line-height:1.9}
.btn-hero{display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border-radius:12px;font-weight:700;font-size:13.5px;color:#fff;
  background:linear-gradient(135deg,rgba(124,92,255,.95),rgba(84,70,238,.95));border:1px solid rgba(190,180,255,.5);box-shadow:0 0 24px rgba(124,92,255,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-hero:hover{transform:translateY(-1px)}
.robot{position:absolute;left:4%;bottom:0;height:95%;width:auto;z-index:1;pointer-events:none;filter:drop-shadow(0 0 18px rgba(124,92,255,.55))}
@keyframes float{50%{transform:translateY(-7px)}}

/* ring */
.ring-card{display:flex;flex-direction:column}
.ring-card h3{font-size:15px;font-weight:700;text-align:center;margin-bottom:8px}
.ring-wrap{position:relative;width:154px;height:154px;margin:2px auto 10px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:11}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:11;stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(31,200,160,.65))}
.anim .ring-fg{animation:ring 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dashoffset:339.3}}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
.ring-meta{text-align:center;font-size:12px;line-height:1.9}
.ring-meta .ok{color:var(--teal);font-weight:600}.ring-meta .sub{color:var(--muted)}

/* quick actions */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:88px;border-radius:16px;color:#fff;font-size:12.5px;font-weight:700;text-align:center;line-height:1.5;padding:10px;
  border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px rgba(0,0,0,.35);transition:.18s}
.qa:hover{transform:translateY(-2px);filter:brightness(1.1)}
.qa.p{background:linear-gradient(145deg,#8a62ff,#5d3fe0)}
.qa.b{background:linear-gradient(145deg,#4a86ff,#2a55e0)}
.qa.a{background:linear-gradient(145deg,#f3b52a,#c8830b)}
.qa.g{background:linear-gradient(145deg,#2fd6a8,#12a07e)}

/* tasks */
.task-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,142,255,.12)}
.task-row:last-child{border:0;padding-bottom:0}
.task-row:first-child{padding-top:2px}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #5f67a2;display:grid;place-items:center;background:transparent;cursor:pointer;transition:.15s}
.chk:hover{border-color:#9a8cff}
.chk:checked{background:linear-gradient(135deg,#8a62ff,#5547ee);border-color:#a79dff;box-shadow:0 0 12px rgba(124,92,255,.6)}
.chk:checked::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task-copy{flex:1;min-width:0}
.task-copy b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-copy small{color:var(--dim);font-size:11px}
.done .task-copy b{text-decoration:line-through;color:#7b83b5}
.tag{font-size:10.5px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:#b4b9e0;white-space:nowrap;border:1px solid rgba(255,255,255,.06)}
.tag.high{background:rgba(240,97,122,.14);color:#ff8fa0;border-color:rgba(240,97,122,.25)}
.tag.mid{background:rgba(240,168,28,.14);color:#f6c256;border-color:rgba(240,168,28,.25)}
.tag.low{background:rgba(31,200,160,.14);color:#4fe0bd;border-color:rgba(31,200,160,.25)}
.tag.ev{background:rgba(39,211,240,.12);color:#6fe3f7;border-color:rgba(39,211,240,.25)}
.tag.rm{background:rgba(124,92,255,.16);color:#b3a6ff;border-color:rgba(124,92,255,.3)}
.time-chip{flex:none;min-width:22px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--cyan)}
.time-txt{color:var(--cyan);font-size:11.5px;font-weight:600;flex:none}

/* mini calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav .t{font-weight:700;font-size:15px}
.cal-arrow{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.cal-arrow:hover{background:rgba(255,255,255,.08);color:#fff}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}
.cal-dn{color:var(--dim);font-size:11px;padding:4px 0}
.cal-d{position:relative;height:34px;border-radius:50%;font-size:13px;color:#dfe2ff;display:grid;place-items:center;margin:auto;width:34px}
.cal-d:hover{background:rgba(255,255,255,.08)}
.cal-d.has::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.cal-d.is-today{background:linear-gradient(135deg,#8a62ff,#5547ee);color:#fff;font-weight:700;box-shadow:0 0 16px rgba(124,92,255,.7)}
.cal-d.is-sel:not(.is-today){outline:1.5px solid rgba(165,155,255,.7)}

/* weekly summary */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum{border-radius:15px;padding:14px 14px 12px;text-align:center;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px rgba(0,0,0,.3)}
.sum b{display:block;font-size:30px;font-weight:800;line-height:1.3}
.sum span{font-size:11.5px;opacity:.92}
.sum.b{background:linear-gradient(145deg,#3b6cf0,#243f9f)}
.sum.p{background:linear-gradient(145deg,#7a52f0,#4a2fb4)}
.sum.a{background:linear-gradient(145deg,#d99a15,#8f5e08)}
.sum.g{background:linear-gradient(145deg,#1fb98a,#0c7a5e)}

/* activity */
.act{display:flex;align-items:center;gap:12px;padding:9px 0}
.act-ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(124,92,255,.18);color:#b3a6ff;border:1px solid rgba(165,155,255,.25)}
.act-ic.teal{background:rgba(31,200,160,.14);color:#4fe0bd;border-color:rgba(31,200,160,.3)}
.act-ic.blue{background:rgba(59,115,245,.16);color:#8fb0ff;border-color:rgba(59,115,245,.3)}
.act-ic.amber{background:rgba(240,168,28,.14);color:#f6c256;border-color:rgba(240,168,28,.3)}
.act-ic.cyan{background:rgba(39,211,240,.12);color:#6fe3f7;border-color:rgba(39,211,240,.3)}
.act b{display:block;font-size:13px;font-weight:600;line-height:1.5}
.act small{color:var(--dim);font-size:11px}

/* connections */
.conn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;margin-bottom:10px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.conn:last-child{margin-bottom:0}
.conn b{font-size:13.5px;font-weight:600}
.st{display:flex;align-items:center;gap:7px;font-size:11.5px}
.st::before{content:'';width:8px;height:8px;border-radius:50%}
.st.ok{color:var(--teal)}.st.ok::before{background:var(--teal);box-shadow:0 0 9px var(--teal)}
.st.warn{color:#f6c256}.st.warn::before{background:var(--amber);box-shadow:0 0 9px var(--amber)}
.st.off{color:var(--dim)}.st.off::before{background:#4a5080}

/* ---------- inner pages ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:800;line-height:1.4}
.page-head p{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.field,select,textarea{background:rgba(8,10,35,.55);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:0;color:var(--ink)}
.field:focus,select:focus,textarea:focus{border-color:rgba(165,155,255,.7);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
.field::placeholder,textarea::placeholder{color:var(--dim)}
.search{flex:1;min-width:200px;max-width:380px}
.chips{display:flex;gap:6px;padding:4px;border-radius:13px;background:rgba(8,10,35,.5);border:1px solid var(--line)}
.chip{padding:6px 14px;border-radius:9px;font-size:12.5px;color:var(--muted);font-weight:500}
.chip.on{background:linear-gradient(135deg,#7c5cff,#5547ee);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(108,86,255,.4)}
.bar-track{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 8px}
.bar-track span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7c5cff,#1fc8a0);box-shadow:0 0 12px rgba(31,200,160,.5)}
.meta-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}

.note-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.note-card{min-height:170px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.note-card::after{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--acc,#7c5cff);box-shadow:0 0 16px var(--acc,#7c5cff)}
.note-card.n1{--acc:#7c5cff}.note-card.n2{--acc:#3b73f5}.note-card.n3{--acc:#f0a81c}.note-card.n4{--acc:#1fc8a0}
.note-card h3{font-size:15px;font-weight:700}
.note-card p{color:#b8bde6;font-size:12.5px;line-height:1.95;white-space:pre-wrap;flex:1}
.note-foot{display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:11px}

.cal-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.85fr);gap:16px;align-items:start}
.big-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.big-grid .cal-dn{font-size:12px}
.bcell{min-height:74px;padding:7px 8px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(150,142,255,.12);text-align:right;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#dfe2ff;transition:.15s}
.bcell:hover{background:rgba(255,255,255,.08)}
.bcell.is-today{background:linear-gradient(145deg,rgba(138,98,255,.55),rgba(85,71,238,.4));border-color:rgba(190,180,255,.6);box-shadow:0 0 18px rgba(124,92,255,.45);font-weight:700}
.bcell.is-sel:not(.is-today){border-color:rgba(190,180,255,.75)}
.bcell .chipev{display:block;font-size:9.5px;font-weight:500;padding:1px 6px;border-radius:5px;background:rgba(39,211,240,.14);color:#7fe6f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcell .more{font-size:9.5px;color:var(--dim)}
.day-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,142,255,.12)}
.day-item:last-child{border:0}
.day-item b{display:block;font-size:13px;font-weight:600;line-height:1.5}
.day-item small{color:var(--dim);font-size:11px}
.side-title{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 6px}

.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-size:28px;font-weight:800;line-height:1.4}
.stat-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.stat-ic.p{background:rgba(124,92,255,.2);color:#b3a6ff}.stat-ic.g{background:rgba(31,200,160,.16);color:#4fe0bd}
.stat-ic.a{background:rgba(240,168,28,.16);color:#f6c256}.stat-ic.r{background:rgba(240,97,122,.16);color:#ff8fa0}
.rep-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.rep-wide{grid-column:1/-1}
.chart{height:210px;display:flex;align-items:flex-end;gap:clamp(8px,2vw,22px);padding:24px 6px 0;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 41px,rgba(150,142,255,.1) 42px)}

.legend{display:flex;gap:16px;color:var(--muted);font-size:11.5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}

const faNum=n=>new Intl.NumberFormat('fa-IR',{useGrouping:false}).format(n);
const fmtDate=s=>{if(!s)return 'بدون موعد';try{const [gy,gm,gd]=s.split('-').map(Number),[jy,jm,jd]=g2j(gy,gm,gd);return `${faNum(jd)} ${MONTHS[jm-1]} ${faNum(jy)}`}catch{return s}};
const ago=ts=>{const s=(Date.now()-ts)/1000;if(s<60)return 'همین حالا';if(s<3600)return faNum(Math.floor(s/60))+' دقیقه پیش';if(s<86400)return faNum(Math.floor(s/3600))+' ساعت پیش';return faNum(Math.floor(s/86400))+' روز پیش'};

/* Jalali conversion */
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];const gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){if(gd<=sa[gm])break;gd-=sa[gm]}return[gy,gm,gd]}

function isoFromJalali(y,m,d){const [gy,gm,gd]=j2g(y,m,d);return `${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}
function jalaliDateField(name,label,iso){const [gy,gm,gd]=iso.split('-').map(Number),[jy,jm,jd]=g2j(gy,gm,gd);return `<label>${label}<span class="jalali-date-wrap"><input class="field jalali-date-display" type="text" value="${faNum(jy)}/${faNum(String(jm).padStart(2,'0'))}/${faNum(String(jd).padStart(2,'0'))}" readonly aria-label="${label} به تقویم شمسی"><input type="hidden" name="${name}" value="${iso}"><button type="button" class="jalali-date-toggle" data-jalali-toggle aria-label="انتخاب تاریخ شمسی">${ic('calendar',18)}</button><span class="jalali-picker" data-jalali-picker hidden></span></span></label>`}
function renderJalaliPicker(picker,year,month,selected){
  const first=j2g(year,month,1),firstDate=new Date(Date.UTC(first[0],first[1]-1,first[2],12));
  const next=month===12?j2g(year+1,1,1):j2g(year,month+1,1),nextDate=new Date(Date.UTC(next[0],next[1]-1,next[2],12));
  const start=(firstDate.getUTCDay()+1)%7,len=Math.round((nextDate-firstDate)/864e5),todayIso=today();
  const week=['ش','ی','د','س','چ','پ','ج'].map(x=>`<span class="jalali-picker-week">${x}</span>`).join('');
  let days='<span></span>'.repeat(start);
  for(let d=1;d<=len;d++){const iso=isoFromJalali(year,month,d);days+=`<button type="button" class="jalali-picker-day ${iso===selected?'selected':''} ${iso===todayIso?'today':''}" data-jalali-day="${iso}">${faNum(d)}</button>`}
  picker.dataset.year=year;picker.dataset.month=month;picker.innerHTML=`<div class="jalali-picker-head"><button type="button" class="jalali-picker-nav" data-jalali-step="-1" aria-label="ماه قبل">‹</button><strong>${MONTHS[month-1]} ${faNum(year)}</strong><button type="button" class="jalali-picker-nav" data-jalali-step="1" aria-label="ماه بعد">›</button></div><div class="jalali-picker-grid">${week}${days}</div>`;
}

function monthInfo(){const g=j2g(jm.y,jm.m,1);const first=new Date(Date.UTC(g[0],g[1]-1,g[2],12));const ny=jm.m===12?jm.y+1:jm.y,nm=jm.m===12?1:jm.m+1;const n=j2g(ny,nm,1);const next=new Date(Date.UTC(n[0],n[1]-1,n[2],12));return{first,len:Math.round((next-first)/864e5),start:(first.getUTCDay()+1)%7}}
const isoOf=(first,d)=>new Date(first.getTime()+(d-1)*864e5).toISOString().slice(0,10);
const hasItems=ds=>data.events.some(e=>e.date===ds)||data.reminders.some(r=>r.date===ds)||data.tasks.some(t=>t.date===ds&&!t.done);

/* ---------- nav ---------- */
function nav(){
  document.getElementById('sideNav').innerHTML=NAV.map(([id,icon,label])=>`<button class="nav-btn ${current===id?'active':''}" data-view="${id}">${ic(icon,19)}${label}</button>`).join('');
  document.getElementById('mobileNav').innerHTML=NAV.map(([id,icon,,short])=>`<button class="${current===id?'active':''}" data-view="${id}">${ic(icon,20)}${short}</button>`).join('');
}

window.lifeosSetDisplayName=(name)=>{USER=String(name||'دوست').trim().slice(0,60)||'دوست';const u=document.getElementById('uname'),a=document.getElementById('avatar'),g=document.querySelector('.hero-text h2'),n=document.getElementById('settingsName');if(u)u.textContent=USER;if(a)a.textContent=USER.charAt(0);if(g)g.innerHTML=`سلام <bdi>${esc(USER)}</bdi>! 👋`;if(n)n.value=USER};

/* ---------- pages ---------- */
function dashboard(){
  const T=today(),done=data.tasks.filter(t=>t.done).length,total=data.tasks.length,pct=total?Math.round(done/total*100):0,open=total-done;
  const late=data.tasks.filter(t=>!t.done&&t.date&&t.date<T).length;
  const C=339.292,off=(C*(1-pct/100)).toFixed(2);
  const todayTasks=data.tasks.filter(t=>t.date===T);

function buildDailyPlan(targetDate,startValue,endValue,focusMinutes){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(targetDate))return {error:'تاریخ برنامه را انتخاب کن.'};
  const toMinutes=value=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(value))return NaN;const [h,m]=value.split(':').map(Number);return h*60+m};
  let start=toMinutes(startValue),end=toMinutes(endValue);
  if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return {error:'ساعت پایان باید بعد از ساعت شروع باشد.'};
  if(targetDate===today()){const now=new Date(),currentMinutes=now.getHours()*60+now.getMinutes();start=Math.max(start,currentMinutes+5)}
  if(start>=end)return {error:'بازهٔ انتخاب‌شده برای امروز گذشته است؛ ساعت شروع یا پایان را تغییر بده.'};
  const eligible=data.tasks.filter(t=>!t.done&&(!t.date||t.date<=targetDate)).sort((a,b)=>{
    const overdueA=!!a.date&&a.date<targetDate,overdueB=!!b.date&&b.date<targetDate;
    if(overdueA!==overdueB)return overdueA?-1:1;
    if(a.date&&b.date&&a.date!==b.date)return a.date.localeCompare(b.date);
    const rank={high:0,mid:1,low:2};return (rank[a.priority]??1)-(rank[b.priority]??1);
  });
  const anchors=[];
  const addAnchors=(items,kind,duration)=>items.filter(item=>item.date===targetDate&&/^([01]\d|2[0-3]):[0-5]\d$/.test(String(item.time||''))).forEach(item=>{
    const at=toMinutes(item.time),length=Math.max(5,Number(item.duration)||duration),finish=at+length;
    if(finish<=start||at>=end)return;
    anchors.push({start:Math.max(start,at),end:Math.min(end,finish),kind,title:String(item.title||kind)});
  });
  addAnchors(data.events,'رویداد',60);addAnchors(data.reminders,'یادآور',5);
  anchors.sort((a,b)=>a.start-b.start||a.end-b.end);
  const fixed=[];
  for(const anchor of anchors){const last=fixed[fixed.length-1];if(last&&anchor.start<=last.end){last.end=Math.max(last.end,anchor.end);last.labels.push(`${anchor.kind}: ${anchor.title}`)}else fixed.push({...anchor,labels:[`${anchor.kind}: ${anchor.title}`]})}
  const blocks=[];let cursor=start,taskIndex=0,fixedIndex=0,scheduled=0;const breakMinutes=10;
  while(cursor<end&&(taskIndex<eligible.length||fixedIndex<fixed.length)){
    while(fixedIndex<fixed.length&&fixed[fixedIndex].end<=cursor)fixedIndex++;
    const anchor=fixed[fixedIndex];
    if(anchor&&anchor.start<=cursor){blocks.push({type:'fixed',start:cursor,end:anchor.end,title:anchor.labels.join(' · ')});cursor=anchor.end;fixedIndex++;continue}
    const freeUntil=Math.min(end,anchor?anchor.start:end);
    if(taskIndex<eligible.length&&freeUntil-cursor>=focusMinutes){const task=eligible[taskIndex++];blocks.push({type:'task',start:cursor,end:cursor+focusMinutes,title:String(task.title||'کار'),meta:task.date&&task.date<targetDate?'عقب‌افتاده':task.priority==='high'?'اولویت بالا':'تمرکز'});cursor+=focusMinutes;scheduled++;if(taskIndex<eligible.length&&cursor+breakMinutes<=Math.min(end,anchor?anchor.start:end)){blocks.push({type:'break',start:cursor,end:cursor+breakMinutes,title:'استراحت کوتاه'});cursor+=breakMinutes}continue}
    if(anchor){cursor=Math.max(cursor,anchor.start);continue}
    break;
  }
  const timeLabel=value=>faNumStr(`${String(Math.floor(value/60)).padStart(2,'0')}:${String(value%60).padStart(2,'0')}`);
  return {targetDate,start,end,focusMinutes,eligibleCount:eligible.length,scheduled,unplanned:eligible.length-scheduled,blocks,timeLabel};
}
function renderDailyPlan(plan){
  const target=document.getElementById('dailyPlannerResult');if(!target)return;
  if(plan.error){target.innerHTML=`<div class="planner-warn">${esc(plan.error)}</div>`;return}
  if(!plan.blocks.length){target.innerHTML='<div class="empty">برای این بازه کار یا برنامه‌ای پیدا نشد.</div>';return}
  const rows=plan.blocks.map(block=>{let content='';if(block.type==='task')content=`▫️ ${esc(block.title)}<small>${esc(block.meta)}</small>`;else if(block.type==='break')content=`☕ ${esc(block.title)}`;else content=`📌 ${esc(block.title)}`;return `<div class="planner-row ${block.type}"><div class="planner-time">${plan.timeLabel(block.start)} – ${plan.timeLabel(block.end)}</div><div class="planner-copy">${content}</div></div>`}).join('');
  const warning=plan.unplanned?`<div class="planner-warn">${faNum(plan.unplanned)} کار به‌دلیل محدودیت زمان در این برنامه جا نشد.</div>`:'';
  target.innerHTML=`<div class="planner-output"><div class="planner-summary">${fmtDate(plan.targetDate)} · ${faNum(plan.scheduled)} از ${faNum(plan.eligibleCount)} کار در برنامه جا گرفت · هر نوبت ${faNum(plan.focusMinutes)} دقیقه</div>${rows}${warning}</div>`;
}
let smartSuggestionRequest=0;
async function loadSmartSuggestion(){

  target.textContent='در حال آماده‌کردن پیشنهاد…';

  const until=`${horizon.getFullYear()}-${String(horizon.getMonth()+1).padStart(2,'0')}-${String(horizon.getDate()).padStart(2,'0')}`;
  const overdue=tasks.filter(t=>!t.done&&t.date&&t.date<now).length;

  const prompt=`برای کاربر LIFEOS یک پیشنهاد کوتاه، عملی و دلگرم‌کننده به فارسی بنویس. فقط از این آمار ناشناس استفاده کن و هیچ اطلاعات شخصی یا عنوان کاری فرض نکن. اگر هنوز کاری ثبت نشده، پیشنهاد بده با یک کار کوچک شروع کند. از قضاوت یا لحن سرزنش‌گر پرهیز کن. آمار: کل کارها ${tasks.length}، انجام‌شده ${done}، باز ${open}، عقب‌افتاده ${overdue}، موعددار در ۷ روز آینده ${upcoming}، یادداشت‌ها ${Array.isArray(data.notes)?data.notes.length:0}، رویدادها ${Array.isArray(data.events)?data.events.length:0}، یادآورها ${Array.isArray(data.reminders)?data.reminders.length:0}. پاسخ حداکثر سه جمله باشد.`;
  try{
    const answer=await window.askOpenRouter(prompt);
    if(requestId===smartSuggestionRequest&&document.getElementById('smartSuggestion'))target.textContent=answer;
  }catch(err){
    if(requestId===smartSuggestionRequest&&document.getElementById('smartSuggestion'))target.textContent=err.message||'پیشنهاد آماده نشد. دوباره تلاش کن.';
  }
}
function researchPage(){
  return head('دستیار هوشمند','پرسش‌ها و پاسخ‌های هوشمند')+
  `<div class="card deco"><form id="researchForm" class="form-grid"><label>سؤال تحقیق<textarea id="researchQuestion" rows="4" maxlength="300" placeholder="مثلاً: روش‌های ساده برای برنامه‌ریزی هفتگی چیست؟"></textarea></label><div class="form-actions"><button class="btn btn-primary">${ic('search',16)}ثبت درخواست</button></div></form><div id="researchResult"></div></div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>${ic('link',18)}اتصال ربات تلگرام</h3></div><p class="note-small">حساب LIFEOS را امن و موقت به چت تلگرام خود پیوند بده. سپس ربات می‌تواند کارها را با داده‌های همین حساب همگام کند.</p><button class="btn btn-primary" type="button" onclick="window.connectLifeosTelegram?.()">اتصال به @MassistantNbot</button><div id="telegramStatus" style="margin-top:12px"></div><div class="command-box" style="margin-top:14px">بعد از پیوند: <span>/tasks</span>، <span>/add متن کار</span>، <span>/done شناسه</span>، <span>/report</span></div></div>`;
}
function settingsPage(){
  const email=window.lifeosUser?.email||'';
  return head('تنظیمات','مدیریت نام نمایشی و حساب کاربری')+
  `<div class="settings-layout"><section class="card deco"><div class="card-head"><h3>${ic('settings',18)}پروفایل</h3></div><form id="settingsForm" class="form-grid"><label>نام نمایشی<input class="field" id="settingsName" maxlength="60" required value="${esc(USER)}" placeholder="نامی که در برنامه دیده می‌شود"></label><label>ایمیل حساب<input class="field" value="${esc(email)}" readonly></label><div class="form-actions"><button class="btn btn-primary">ذخیره تغییرات</button></div></form><p class="note-small" id="settingsStatus" aria-live="polite"></p></section><section class="card"><div class="card-head"><h3>${ic('link',18)}حساب و دسترسی</h3></div><p class="note-small">اطلاعات هر حساب جداگانه نگهداری می‌شود. خروج از حساب، داده‌های ذخیره‌شده را حذف نمی‌کند.</p><button class="btn btn-ghost" type="button" data-logout>خروج از حساب</button></section></div>`;
}
function render(anim){
  document.querySelectorAll('.page').forEach(p=>{const on=p.id===current;p.classList.toggle('active',on);if(!on)p.innerHTML=''});
  const el=document.getElementById(current);
  el.innerHTML=({dashboard,tasks:tasksPage,calendar:calendarPage,notes:notesPage,analytics:analyticsPage,research:researchPage,settings:settingsPage})[current]();
  el.classList.toggle('anim',!!anim);
  if(current==='tasks')tasksRender();
  if(current==='notes')notesRender();
  if(current==='analytics')void loadSmartSuggestion();
  refreshBell();
}
function refreshBell(){const n=data.reminders.filter(r=>r.date===today()).length;document.getElementById('bellDot').hidden=!n}

/* ---------- modal ---------- */
function modal(type,date){
  const d=date||today();let title='',fields='';
  if(type==='task'){title='افزودن وظیفه';fields=`<label>عنوان وظیفه<input class="field" name="title" required maxlength="100" placeholder="مثلاً تماس با…"></label><div class="two">${jalaliDateField('date','موعد شمسی',d)}<label>اولویت<select name="priority"><option value="mid">معمولی</option><option value="high">مهم</option><option value="low">کم</option></select></label></div>`}
  else if(type==='note'){title='یادداشت جدید';fields=`<label>عنوان<input class="field" name="title" required maxlength="80" placeholder="عنوان یادداشت"></label><label>متن<textarea name="body" rows="4" required placeholder="آنچه می‌خواهی به خاطر بسپاری…"></textarea></label>`}
  else if(type==='event'){title='رویداد جدید';fields=`<label>عنوان رویداد<input class="field" name="title" required maxlength="100" placeholder="مثلاً جلسه یا قرار"></label><div class="two">${jalaliDateField('date','تاریخ شمسی',d)}<label>زمان<input class="field" name="time" type="time" value="09:00"></label></div>`}
  else{title='یادآور جدید';fields=`<label>عنوان یادآور<input class="field" name="title" required maxlength="100" placeholder="یادآوری برای…"></label><div class="two">${jalaliDateField('date','تاریخ شمسی',d)}<label>زمان<input class="field" name="time" type="time" value="09:00"></label></div>`}
  const dlg=document.getElementById('modal');
  document.getElementById('modalContent').innerHTML=`<form id="entryForm"><h2>${title}</h2><div class="form-grid">${fields}</div><div class="form-actions"><button class="btn btn-primary">ذخیره</button><button type="button" class="btn btn-ghost" id="cancelModal">انصراف</button></div></form>`;
  dlg.showModal();
  document.getElementById('cancelModal').onclick=()=>dlg.close();
  document.getElementById('entryForm').onsubmit=e=>{
    e.preventDefault();const v=Object.fromEntries(new FormData(e.currentTarget)),id=Date.now(),ti=v.title.trim();
    if(type==='task'){data.tasks.unshift({id,title:ti,date:v.date,priority:v.priority,done:false});log('task','کار جدید: '+ti)}
    if(type==='note'){data.notes.unshift({id,title:ti,body:v.body.trim(),date:today()});log('note','یادداشت جدید: '+ti)}
    if(type==='event'){data.events.push({id,title:ti,date:v.date,time:v.time,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Tehran'});log('event','رویداد جدید: '+ti)}
    if(type==='reminder'){data.reminders.push({id,title:ti,date:v.date,time:v.time,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Tehran'});log('reminder','یادآور جدید: '+ti)}
    save();dlg.close();render();toast('ذخیره شد');
  };
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.close()});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const c=s=>e.target.closest(s);
  let el;
  if(!c('.jalali-date-wrap'))document.querySelectorAll('.jalali-picker').forEach(p=>p.hidden=true);
  if(el=c('[data-jalali-toggle]')){const wrap=el.closest('.jalali-date-wrap'),picker=wrap.querySelector('[data-jalali-picker]');if(picker.hidden){document.querySelectorAll('.jalali-picker').forEach(p=>p.hidden=true);const iso=wrap.querySelector('input[type="hidden"]').value,[gy,gm,gd]=iso.split('-').map(Number),[jy,jm]=g2j(gy,gm,gd);renderJalaliPicker(picker,jy,jm,iso);picker.hidden=false}else picker.hidden=true;return}
  if(el=c('[data-jalali-step]')){const picker=el.closest('[data-jalali-picker]'),wrap=el.closest('.jalali-date-wrap'),iso=wrap.querySelector('input[type="hidden"]').value;let year=Number(picker.dataset.year),month=Number(picker.dataset.month)+Number(el.dataset.jalaliStep);if(month<1){month=12;year--}if(month>12){month=1;year++}renderJalaliPicker(picker,year,month,iso);return}
  if(el=c('[data-jalali-day]')){const wrap=el.closest('.jalali-date-wrap'),iso=el.dataset.jalaliDay,[gy,gm,gd]=iso.split('-').map(Number),[jy,jm,jd]=g2j(gy,gm,gd);wrap.querySelector('input[type="hidden"]').value=iso;wrap.querySelector('.jalali-date-display').value=`${faNum(jy)}/${faNum(String(jm).padStart(2,'0'))}/${faNum(String(jd).padStart(2,'0'))}`;wrap.querySelector('[data-jalali-picker]').hidden=true;return}
  if(el=c('[data-view]')){setView(el.dataset.view);return}
  if(el=c('[data-add]')){modal(el.dataset.add,el.dataset.date);return}
  if(c('[data-go-search]')){const s=document.getElementById('globalSearch');window.scrollTo({top:0,behavior:'smooth'});s.focus();return}
  if(el=c('[data-del-task]')){const t=data.tasks.find(x=>String(x.id)===el.dataset.delTask);data.tasks=data.tasks.filter(x=>String(x.id)!==el.dataset.delTask);save();render();toast('وظیفه حذف شد');return}
  if(el=c('[data-del-note]')){data.notes=data.notes.filter(n=>String(n.id)!==el.dataset.delNote);save();notesRender();toast('یادداشت حذف شد');return}
  if(el=c('[data-filter]')){tf=el.dataset.filter;render();return}
  if(el=c('[data-month]')){jm.m+=Number(el.dataset.month);if(jm.m>12){jm.m=1;jm.y++}if(jm.m<1){jm.m=12;jm.y--}render();return}
  if(el=c('[data-day]')){selDay=el.dataset.day;if(current==='dashboard')setView('calendar');else render();return}
  if(c('[data-refresh-insight]')){void loadSmartSuggestion();return}
  if(c('[data-logout]')){if(window.lifeosSignOut){void window.lifeosSignOut().then(()=>toast('از حساب خارج شدی')).catch(err=>toast(err.message||'خروج انجام نشد'))}else toast('برای خروج، ابتدا وارد حسابت شو');return}
  if(c('#bell')){const n=data.reminders.filter(r=>r.date===today()).length;toast(n?`${faNum(n)} یادآور برای امروز داری`:'اعلان جدیدی نداری');return}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-done]')){
    const t=data.tasks.find(x=>String(x.id)===e.target.dataset.done);
    if(t){t.done=e.target.checked;if(t.done)log('done','انجام شد: '+t.title);save();render();toast(t.done?'وظیفه تکمیل شد':'وضعیت به‌روزرسانی شد')}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='taskSearch'){tq=e.target.value;tasksRender()}
  if(e.target.id==='noteSearch'){nq=e.target.value;notesRender()}
});
document.getElementById('globalSearch').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  tq=nq=e.target.value.trim();
  const inTasks=data.tasks.some(t=>t.title.toLowerCase().includes(q)),inNotes=data.notes.some(n=>(n.title+n.body).toLowerCase().includes(q));
  setView(!inTasks&&inNotes?'notes':'tasks');
  if(!inTasks&&!inNotes)toast('نتیجه‌ای پیدا نشد');
  e.target.blur();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='dailyPlannerForm'){
    e.preventDefault();const values=Object.fromEntries(new FormData(e.target));
    renderDailyPlan(buildDailyPlan(String(values.plannerDate||''),String(values.planStart||''),String(values.planEnd||''),Number(values.focusMinutes)||45));return;
  }
  if(e.target.id==='settingsForm'){
    e.preventDefault();const status=document.getElementById('settingsStatus'),name=document.getElementById('settingsName').value.trim();
    status.textContent='در حال ذخیره…';window.lifeosUpdateName?.(name).then(()=>{status.textContent='نام نمایشی ذخیره شد ✅'}).catch(err=>{status.textContent=err.message||'ذخیرهٔ نام انجام نشد'});return;
  }
  if(e.target.id==='researchForm'){
    e.preventDefault();const q=document.getElementById('researchQuestion').value.trim(),out=document.getElementById('researchResult');if(!q)return;
    out.innerHTML=`<div class="insight" style="margin-top:16px"><div class="insight-title">${ic('spark',15)}در حال دریافت پاسخ…</div><p>پرسش متنی به OpenRouter فرستاده می‌شود.</p></div>`;
    window.askOpenRouter(q).then(answer=>{out.innerHTML=`<div class="insight" style="margin-top:16px"><div class="insight-title">${ic('spark',15)}پاسخ LIFEOS</div><p style="white-space:pre-wrap">${esc(answer)}</p></div>`}).catch(err=>{out.innerHTML=`<div class="insight" style="margin-top:16px"><div class="insight-title">${ic('alert',15)}اتصال برقرار نشد</div><p>${esc(err.message)}</p></div>`});
  }
});

/* ---------- init ---------- */
document.getElementById('uname').textContent=USER;
document.getElementById('avatar').textContent=USER.charAt(0).toLowerCase();
function tick(){const d=new Date();const P=Object.fromEntries(new Intl.DateTimeFormat('fa-IR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(d).map(x=>[x.type,x.value]));document.getElementById('dateTxt').textContent=`${P.weekday} ${P.day} ${P.month} ${P.year}`;document.getElementById('clock').textContent='ساعت '+new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
tick();setInterval(tick,20000);
(function stars(){const mk=(n,a0)=>{const s=[];for(let i=0;i<n;i++){s.push(`${(Math.random()*100).toFixed(1)}vw ${(Math.random()*100).toFixed(1)}vh 0 0 rgba(${200+Math.random()*55|0},${210+Math.random()*45|0},255,${(a0+Math.random()*.5).toFixed(2)})`)}return s.join(',')};
  const a=document.querySelector('#stars .s1'),b=document.querySelector('#stars .s2');a.style.boxShadow=mk(130,.25);b.style.boxShadow=mk(45,.4)})();
window.applyLifeosCloudData=(d)=>{data=d;['tasks','notes','events','reminders','activity'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});render()}; nav();render(true);
})();
</script>
